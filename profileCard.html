<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>

<div class="card">
    <div class="profile-img">
        <img src="pic.jpg" alt="Profile Picture">
    </div>
    <div class="card-content">
        <h2>Shrey Verma</h2>
        <p class="designation">Web Developer</p>
        <p class="bio">A passionate web developer with a love for creating beautiful and functional websites.</p>
        <div class="social-icons">
            <a href="https://github.com/Shrey-codes" target="_blank" class="social-icon"><img src="github.png" alt="" class="github"></a>
            <a href="https://www.instagram.com/22shrey_sarraf22/" target="_blank" class="social-icon"><img src="Instagram_icon.png    " alt="" class="instagram"></a>

            <a href="https://www.linkedin.com/in/shrey-verma-961b57198/" target="_blank" class="social-icon"><img src="image.png" alt="" class="linkedin"></a>
        </div>
    </div>
</div>

<!-- FontAwesome for social media icons -->
<!-- <script src="https://kit.fontawesome.com/a076d05399.js"></script> -->
</body>
</html>
